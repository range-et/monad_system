<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apple · Device · Calm</title>
  <link rel="stylesheet" href="../_tokens.css">
  <style>
    /* iOS app idiom — Fitness/Workout summary: large title, grouped
       inset list with rounded card sections, hero metric tile up top. */
    html { background: #000; }
    body {
      width: 390px; height: 844px; margin: 0 auto;
      background: var(--apple-bg-grouped);
      color: var(--apple-label);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* Large Title nav region */
    .titlebar {
      padding: 8px 20px 6px;
    }
    .titlebar .eyebrow {
      font: var(--apple-weight-semibold) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: var(--apple-label-secondary);
      letter-spacing: -0.01em;
    }
    .titlebar h1 {
      margin: 4px 0 0 0;
      font-family: var(--apple-font-display);
      font-weight: var(--apple-weight-bold);
      font-size: var(--apple-text-large-title);
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--apple-label);
    }

    /* Focal: hero speed card — Apple Watch Workout summary feel */
    #focal-target {
      margin: 16px 16px 12px;
      padding: 20px 22px 22px;
      background: var(--apple-bg-system);
      border-radius: var(--apple-radius-card-l);
      box-shadow: var(--apple-shadow-card);
    }
    #focal-target .eyebrow {
      display: flex; align-items: center; gap: 8px;
      font: var(--apple-weight-semibold) var(--apple-text-headline) / 1 var(--apple-font-system);
      color: var(--apple-blue);
      letter-spacing: -0.02em;
    }
    #focal-target .value-row {
      display: flex; align-items: baseline; gap: 4px;
      margin-top: 10px;
    }
    #focal-target .hero {
      font-family: var(--apple-font-display);
      font-weight: var(--apple-weight-bold);
      font-size: 76px;
      line-height: 0.92;
      letter-spacing: -0.05em;
      color: var(--apple-label);
      font-variant-numeric: tabular-nums;
    }
    #focal-target .unit {
      font-weight: var(--apple-weight-semibold);
      font-size: var(--apple-text-title-3);
      color: var(--apple-label-secondary);
      margin-left: 6px;
    }
    #focal-target .caption {
      margin-top: 6px;
      font: var(--apple-weight-medium) var(--apple-text-subhead) / 1.3 var(--apple-font-system);
      color: var(--apple-label-secondary);
    }

    /* Grouped inset list — secondary metrics */
    .group-header {
      padding: 0 20px 8px;
      font: var(--apple-weight-semibold) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: var(--apple-label-secondary);
      letter-spacing: -0.01em;
      text-transform: none;
      margin-top: 8px;
    }
    .grouped {
      margin: 0 16px;
      background: var(--apple-bg-system);
      border-radius: var(--apple-radius-card-l);
      box-shadow: var(--apple-shadow-card);
      overflow: hidden;
    }
    .row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 18px;
    }
    .row + .row {
      border-top: 0.5px solid var(--apple-separator);
    }
    .row .label {
      display: flex; align-items: center; gap: 10px;
      font: var(--apple-weight-medium) var(--apple-text-body) / 1 var(--apple-font-system);
      color: var(--apple-label);
      letter-spacing: -0.02em;
    }
    .row .icon {
      width: 28px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 8px;
      font-size: 14px;
      color: #FFFFFF;
    }
    .row .icon--red    { background: var(--apple-red); }
    .row .icon--orange { background: var(--apple-orange); }
    .row .icon--indigo { background: var(--apple-indigo); }
    .row .icon--green  { background: var(--apple-green); }
    .row .value {
      font-family: var(--apple-font-system);
      font-weight: var(--apple-weight-semibold);
      font-size: var(--apple-text-body);
      color: var(--apple-label-secondary);
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .footer {
      margin-top: auto;
      padding: 14px 20px 20px;
      display: flex; justify-content: space-between;
      font: var(--apple-weight-semibold) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: var(--apple-label-tertiary);
    }
  </style>
</head>
<body>
  <div class="apple-statusbar">
    <span>9:41</span>
    <span class="right">●●●●● 5G&nbsp;&nbsp;78%</span>
  </div>

  <div class="titlebar">
    <div class="eyebrow">Whistler · Idle</div>
    <h1>Today’s Ride</h1>
  </div>

  <div id="focal-target" data-focal="primary metric tile (speed)">
    <div class="eyebrow"><span>●</span>Speed</div>
    <div class="value-row">
      <span class="hero">38</span><span class="unit">km/h</span>
    </div>
    <div class="caption">Cruise pace · last run 38 km/h</div>
  </div>

  <div class="group-header">Session</div>
  <div class="grouped">
    <div class="row">
      <span class="label"><span class="icon icon--red">♥</span>Heart rate</span>
      <span class="value">132 bpm</span>
    </div>
    <div class="row">
      <span class="label"><span class="icon icon--indigo">▲</span>Elevation</span>
      <span class="value">2,140 m</span>
    </div>
    <div class="row">
      <span class="label"><span class="icon icon--green">◉</span>Distance</span>
      <span class="value">14.2 km</span>
    </div>
    <div class="row">
      <span class="label"><span class="icon icon--orange">◷</span>Elapsed</span>
      <span class="value">01:23:45</span>
    </div>
  </div>

  <div class="footer">
    <span>Stable · Clear</span>
    <span>Synced</span>
  </div>
</body>
</html>
