<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apple · Ski AR · Calm</title>
  <link rel="stylesheet" href="../_tokens.css">
  <style>
    /* Apple HIG calm: think Apple Watch Workout summary tile floating
       over the scene. Translucent "material" panels with generous rounded
       corners and a hero numeric for the at-a-glance speed. */
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background-image: url("../../../underlay_skiing.png");
      background-size: cover;
      background-position: center;
    }
    .scene { position: relative; width: 100%; height: 100%; }

    /* Top-left: route identity pill */
    .nav {
      position: absolute; top: var(--apple-s6); left: var(--apple-s6);
      display: flex; gap: var(--apple-s2); align-items: center;
    }
    .nav__title {
      padding: 10px 18px;
      border-radius: var(--apple-radius-pill);
      background: var(--apple-material-thick);
      -webkit-backdrop-filter: var(--apple-material-blur);
              backdrop-filter: var(--apple-material-blur);
      font: var(--apple-weight-semibold) var(--apple-text-headline) / 1 var(--apple-font-system);
      color: var(--apple-label);
      letter-spacing: -0.02em;
      box-shadow: var(--apple-shadow-card);
    }
    .nav__sub {
      padding: 8px 14px;
      border-radius: var(--apple-radius-pill);
      background: var(--apple-material-regular);
      -webkit-backdrop-filter: var(--apple-material-blur);
              backdrop-filter: var(--apple-material-blur);
      font: var(--apple-weight-medium) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: var(--apple-label-secondary);
    }

    /* Top-right: system chips */
    .sysbar {
      position: absolute; top: var(--apple-s6); right: var(--apple-s6);
      display: flex; gap: var(--apple-s2);
    }

    /* Focal: hero metric card (Workout-summary feel). Larger surface than
       neighbours, hero numeric in SF Pro Display Bold. */
    #focal-target {
      position: absolute;
      left: var(--apple-s8); bottom: var(--apple-s8);
      width: 460px;
      padding: var(--apple-s6) var(--apple-s6) var(--apple-s5);
      background: var(--apple-material-thick);
      -webkit-backdrop-filter: var(--apple-material-blur);
              backdrop-filter: var(--apple-material-blur);
      border-radius: var(--apple-radius-card-xl);
      box-shadow: var(--apple-shadow-elevated);
    }
    #focal-target .eyebrow {
      display: flex; align-items: center; gap: 8px;
      font: var(--apple-weight-semibold) var(--apple-text-headline) / 1 var(--apple-font-system);
      color: var(--apple-blue);
      letter-spacing: -0.02em;
    }
    #focal-target .eyebrow .icon { font-size: 18px; }
    #focal-target .value-row {
      display: flex; align-items: baseline; gap: 6px;
      margin-top: var(--apple-s3);
    }
    #focal-target .hero {
      font-family: var(--apple-font-system);
      font-weight: var(--apple-weight-bold);
      font-size: var(--apple-text-hero-l);
      line-height: 0.9;
      letter-spacing: -0.05em;
      color: var(--apple-label);
      font-variant-numeric: tabular-nums;
    }
    #focal-target .hero-unit {
      font-weight: var(--apple-weight-semibold);
      font-size: var(--apple-text-title-2);
      color: var(--apple-label-secondary);
      margin-left: 6px;
      letter-spacing: -0.02em;
    }
    #focal-target .caption {
      margin-top: var(--apple-s2);
      font: var(--apple-weight-medium) var(--apple-text-subhead) / 1.3 var(--apple-font-system);
      color: var(--apple-label-secondary);
    }

    /* Secondary metric row (Activity-rings-row feel) — right of focal */
    .stats {
      position: absolute;
      right: var(--apple-s8); bottom: var(--apple-s8);
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: var(--apple-s3);
      width: 720px;
    }
    .stats .cell {
      padding: var(--apple-s4) var(--apple-s5);
      background: var(--apple-material-regular);
      -webkit-backdrop-filter: var(--apple-material-blur);
              backdrop-filter: var(--apple-material-blur);
      border-radius: var(--apple-radius-card-l);
      box-shadow: var(--apple-shadow-card);
    }
    .stats .k {
      font: var(--apple-weight-semibold) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: var(--apple-label-secondary);
      letter-spacing: -0.01em;
    }
    .stats .v {
      margin-top: 8px;
      font-family: var(--apple-font-system);
      font-weight: var(--apple-weight-semibold);
      font-size: 28px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: var(--apple-label);
      font-variant-numeric: tabular-nums;
    }
    .stats .v small {
      font-size: var(--apple-text-callout);
      color: var(--apple-label-secondary);
      font-weight: var(--apple-weight-medium);
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="scene">

    <div class="nav">
      <div class="nav__title">Whistler · Chair 4</div>
      <div class="nav__sub">Run 03 · cruise</div>
    </div>

    <div class="sysbar">
      <span class="apple-pill"><span class="dot"></span>GPS</span>
      <span class="apple-pill">Battery 78%</span>
      <span class="apple-pill">Clear · −4°C</span>
    </div>

    <div id="focal-target" data-focal="primary speed tile">
      <div class="eyebrow"><span class="icon">●</span>Speed</div>
      <div class="value-row">
        <span class="hero">38</span><span class="hero-unit">km/h</span>
      </div>
      <div class="caption">Cruise pace · 14.2 km this session</div>
    </div>

    <div class="stats">
      <div class="cell">
        <div class="k">Heart rate</div>
        <div class="v">132<small>bpm</small></div>
      </div>
      <div class="cell">
        <div class="k">Elevation</div>
        <div class="v">2,140<small>m</small></div>
      </div>
      <div class="cell">
        <div class="k">Distance</div>
        <div class="v">14.2<small>km</small></div>
      </div>
      <div class="cell">
        <div class="k">Elapsed</div>
        <div class="v">01:23<small>:45</small></div>
      </div>
    </div>

  </div>
</body>
</html>
