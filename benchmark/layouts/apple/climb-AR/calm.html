<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apple · Climb AR · Calm</title>
  <link rel="stylesheet" href="../_tokens.css">
  <style>
    /* Apple HIG calm (climbing): Workout-summary-feel hero metric over a
       Maps-style translucent card. Cadence/HR is the at-a-glance datum
       on a climbing pitch. */
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background-image: url("../../../underlay_rockclimbing.png");
      background-size: cover;
      background-position: center;
    }
    .scene { position: relative; width: 100%; height: 100%; }

    .nav {
      position: absolute; top: var(--apple-s6); left: var(--apple-s6);
      display: flex; gap: var(--apple-s2); align-items: center;
    }
    .nav__title {
      padding: 10px 18px;
      border-radius: var(--apple-radius-pill);
      background: var(--apple-material-thick);
      -webkit-backdrop-filter: var(--apple-material-blur);
              backdrop-filter: var(--apple-material-blur);
      font: var(--apple-weight-semibold) var(--apple-text-headline) / 1 var(--apple-font-system);
      color: var(--apple-label);
      letter-spacing: -0.02em;
      box-shadow: var(--apple-shadow-card);
    }
    .nav__sub {
      padding: 8px 14px;
      border-radius: var(--apple-radius-pill);
      background: var(--apple-material-regular);
      -webkit-backdrop-filter: var(--apple-material-blur);
              backdrop-filter: var(--apple-material-blur);
      font: var(--apple-weight-medium) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: var(--apple-label-secondary);
    }

    .sysbar {
      position: absolute; top: var(--apple-s6); right: var(--apple-s6);
      display: flex; gap: var(--apple-s2);
    }

    /* Focal: hero cadence/HR card, bottom-left */
    #focal-target {
      position: absolute;
      left: var(--apple-s8); bottom: var(--apple-s8);
      width: 480px;
      padding: var(--apple-s6) var(--apple-s6) var(--apple-s5);
      background: var(--apple-material-thick);
      -webkit-backdrop-filter: var(--apple-material-blur);
              backdrop-filter: var(--apple-material-blur);
      border-radius: var(--apple-radius-card-xl);
      box-shadow: var(--apple-shadow-elevated);
    }
    #focal-target .eyebrow {
      display: flex; align-items: center; gap: 8px;
      font: var(--apple-weight-semibold) var(--apple-text-headline) / 1 var(--apple-font-system);
      color: var(--apple-pink);
      letter-spacing: -0.02em;
    }
    #focal-target .value-row {
      display: flex; align-items: baseline; gap: 6px;
      margin-top: var(--apple-s3);
    }
    #focal-target .hero {
      font-family: var(--apple-font-system);
      font-weight: var(--apple-weight-bold);
      font-size: var(--apple-text-hero-l);
      line-height: 0.9;
      letter-spacing: -0.05em;
      color: var(--apple-label);
      font-variant-numeric: tabular-nums;
    }
    #focal-target .hero-unit {
      font-weight: var(--apple-weight-semibold);
      font-size: var(--apple-text-title-2);
      color: var(--apple-label-secondary);
      margin-left: 6px;
    }
    #focal-target .caption {
      margin-top: var(--apple-s2);
      font: var(--apple-weight-medium) var(--apple-text-subhead) / 1.3 var(--apple-font-system);
      color: var(--apple-label-secondary);
    }
    #focal-target .zone {
      margin-top: var(--apple-s4);
      display: flex; align-items: center; justify-content: space-between;
      font: var(--apple-weight-semibold) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: var(--apple-label-secondary);
    }
    #focal-target .zone-bar {
      margin-top: 6px;
      height: 6px; border-radius: 3px;
      background: var(--apple-fill);
      overflow: hidden;
    }
    #focal-target .zone-bar > span {
      display: block; height: 100%; width: 38%;
      background: var(--apple-green); border-radius: 3px;
    }

    /* Secondary tiles, right side */
    .stats {
      position: absolute;
      right: var(--apple-s8); bottom: var(--apple-s8);
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: var(--apple-s3);
      width: 720px;
    }
    .stats .cell {
      padding: var(--apple-s4) var(--apple-s5);
      background: var(--apple-material-regular);
      -webkit-backdrop-filter: var(--apple-material-blur);
              backdrop-filter: var(--apple-material-blur);
      border-radius: var(--apple-radius-card-l);
      box-shadow: var(--apple-shadow-card);
    }
    .stats .k {
      font: var(--apple-weight-semibold) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: var(--apple-label-secondary);
    }
    .stats .v {
      margin-top: 8px;
      font-family: var(--apple-font-system);
      font-weight: var(--apple-weight-semibold);
      font-size: 28px;
      line-height: 1; letter-spacing: -0.03em;
      color: var(--apple-label);
      font-variant-numeric: tabular-nums;
    }
    .stats .v small {
      font-size: var(--apple-text-callout);
      color: var(--apple-label-secondary);
      font-weight: var(--apple-weight-medium);
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="scene">

    <div class="nav">
      <div class="nav__title">Index Town Walls · Pitch 2</div>
      <div class="nav__sub">Route “Godzilla” · 5.9</div>
    </div>

    <div class="sysbar">
      <span class="apple-pill"><span class="dot dot--blue"></span>Belay on</span>
      <span class="apple-pill">Battery 78%</span>
      <span class="apple-pill">Clear · 14°C</span>
    </div>

    <div id="focal-target" data-focal="primary cadence tile (HR at-a-glance)">
      <div class="eyebrow"><span>●</span>Heart rate</div>
      <div class="value-row">
        <span class="hero">132</span><span class="hero-unit">bpm</span>
      </div>
      <div class="caption">Zone 2 · efficient pace · pump 42%</div>
      <div class="zone"><span>Zone 2 · aerobic</span><span>38%</span></div>
      <div class="zone-bar"><span></span></div>
    </div>

    <div class="stats">
      <div class="cell">
        <div class="k">Route</div>
        <div class="v">12<small>/22</small></div>
      </div>
      <div class="cell">
        <div class="k">Pump</div>
        <div class="v">42<small>%</small></div>
      </div>
      <div class="cell">
        <div class="k">On wall</div>
        <div class="v">08:14</div>
      </div>
      <div class="cell">
        <div class="k">Elapsed</div>
        <div class="v">01:23<small>:45</small></div>
      </div>
    </div>

  </div>
</body>
</html>
