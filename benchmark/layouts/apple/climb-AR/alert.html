<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apple · Climb AR · Alert</title>
  <link rel="stylesheet" href="../_tokens.css">
  <style>
    /* Apple HIG alert (climbing): warm systemOrange-filled HR card,
       Watch "elevated heart rate" notification scaled for AR. Other
       telemetry stays in neutral material chips. */
    html, body { width: 1920px; height: 1080px; overflow: hidden; }
    body {
      background-image: url("../../../underlay_rockclimbing.png");
      background-size: cover;
      background-position: center;
    }
    .scene { position: relative; width: 100%; height: 100%; }

    .nav {
      position: absolute; top: var(--apple-s6); left: var(--apple-s6);
      display: flex; gap: var(--apple-s2); align-items: center;
    }
    .nav__title {
      padding: 10px 18px;
      border-radius: var(--apple-radius-pill);
      background: var(--apple-material-thick);
      -webkit-backdrop-filter: var(--apple-material-blur);
              backdrop-filter: var(--apple-material-blur);
      font: var(--apple-weight-semibold) var(--apple-text-headline) / 1 var(--apple-font-system);
      color: var(--apple-label);
      letter-spacing: -0.02em;
      box-shadow: var(--apple-shadow-card);
    }
    .nav__sub {
      padding: 8px 14px;
      border-radius: var(--apple-radius-pill);
      background: var(--apple-material-regular);
      -webkit-backdrop-filter: var(--apple-material-blur);
              backdrop-filter: var(--apple-material-blur);
      font: var(--apple-weight-medium) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: var(--apple-label-secondary);
    }

    .sysbar {
      position: absolute; top: var(--apple-s6); right: var(--apple-s6);
      display: flex; gap: var(--apple-s2);
    }

    /* Focal: HR-zone alert card, mid-right */
    #focal-target {
      position: absolute;
      top: 50%; right: var(--apple-s8);
      transform: translateY(-50%);
      width: 480px;
      padding: var(--apple-s6) var(--apple-s6) var(--apple-s5);
      background: var(--apple-orange);
      color: var(--apple-label-on-tint);
      border-radius: var(--apple-radius-card-xl);
      box-shadow: 0 12px 32px rgba(255, 149, 0, 0.40),
                  0 1px 3px rgba(0, 0, 0, 0.10);
    }
    #focal-target .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px;
      border-radius: var(--apple-radius-pill);
      background: rgba(255, 255, 255, 0.22);
      font: var(--apple-weight-semibold) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: #FFFFFF;
      letter-spacing: -0.01em;
    }
    #focal-target .title {
      margin-top: var(--apple-s4);
      font: var(--apple-weight-semibold) var(--apple-text-title-3) / 1.1 var(--apple-font-system);
      letter-spacing: -0.02em;
      color: #FFFFFF;
    }
    #focal-target .value-row {
      display: flex; align-items: baseline; gap: 6px;
      margin-top: var(--apple-s3);
    }
    #focal-target .hero {
      font-family: var(--apple-font-system);
      font-weight: var(--apple-weight-bold);
      font-size: var(--apple-text-hero-l);
      line-height: 0.9;
      letter-spacing: -0.05em;
      color: #FFFFFF;
      font-variant-numeric: tabular-nums;
    }
    #focal-target .hero-unit {
      font-weight: var(--apple-weight-semibold);
      font-size: var(--apple-text-title-2);
      color: rgba(255, 255, 255, 0.92);
      margin-left: 6px;
    }
    #focal-target .caption {
      margin-top: var(--apple-s2);
      font: var(--apple-weight-medium) var(--apple-text-subhead) / 1.3 var(--apple-font-system);
      color: rgba(255, 255, 255, 0.92);
    }
    #focal-target .zone-row {
      margin-top: var(--apple-s4);
      display: flex; align-items: center; justify-content: space-between;
      font: var(--apple-weight-semibold) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: rgba(255, 255, 255, 0.92);
    }
    #focal-target .zone-bar {
      margin-top: 6px;
      height: 6px; border-radius: 3px;
      background: rgba(255, 255, 255, 0.30);
      overflow: hidden;
    }
    #focal-target .zone-bar > span {
      display: block; height: 100%; width: 86%;
      background: #FFFFFF; border-radius: 3px;
    }

    /* Bottom HUD — quiet neutral material tiles */
    .hud {
      position: absolute; left: var(--apple-s8); bottom: var(--apple-s8);
      display: flex; gap: var(--apple-s3);
    }
    .hud .tile {
      padding: var(--apple-s4) var(--apple-s5);
      min-width: 130px;
      background: var(--apple-material-regular);
      -webkit-backdrop-filter: var(--apple-material-blur);
              backdrop-filter: var(--apple-material-blur);
      border-radius: var(--apple-radius-card-l);
      box-shadow: var(--apple-shadow-card);
    }
    .hud .k {
      font: var(--apple-weight-semibold) var(--apple-text-footnote) / 1 var(--apple-font-system);
      color: var(--apple-label-secondary);
    }
    .hud .v {
      margin-top: 6px;
      font-family: var(--apple-font-system);
      font-weight: var(--apple-weight-semibold);
      font-size: 26px;
      line-height: 1; letter-spacing: -0.03em;
      color: var(--apple-label);
      font-variant-numeric: tabular-nums;
    }
    .hud .v small {
      font-size: var(--apple-text-callout);
      color: var(--apple-label-secondary);
      font-weight: var(--apple-weight-medium);
      margin-left: 4px;
    }
  </style>
</head>
<body>
  <div class="scene">

    <div class="nav">
      <div class="nav__title">Index Town Walls · Pitch 3</div>
      <div class="nav__sub">Move 14 / 22 · 12:47</div>
    </div>

    <div class="sysbar">
      <span class="apple-pill"><span class="dot dot--blue"></span>Belay on</span>
      <span class="apple-pill">Battery 64%</span>
      <span class="apple-pill"><span class="dot dot--warn"></span>Cloud building</span>
    </div>

    <div id="focal-target" data-focal="HR-zone amber flag">
      <span class="badge">▲ Zone 4 · Redline</span>
      <div class="title">Heart rate elevated</div>
      <div class="value-row">
        <span class="hero">168</span><span class="hero-unit">bpm</span>
      </div>
      <div class="caption">Climbing toward Zone 5 — rest at next jug.</div>
      <div class="zone-row"><span>Zone progress</span><span>86%</span></div>
      <div class="zone-bar"><span></span></div>
    </div>

    <div class="hud">
      <div class="tile"><div class="k">Route</div><div class="v">14<small>/22</small></div></div>
      <div class="tile"><div class="k">Grip</div><div class="v">00:34</div></div>
      <div class="tile"><div class="k">Pump</div><div class="v">78<small>%</small></div></div>
      <div class="tile"><div class="k">On wall</div><div class="v">12:47</div></div>
    </div>

  </div>
</body>
</html>
