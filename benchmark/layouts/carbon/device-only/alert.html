<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Carbon · Device · Alert</title>
  <link rel="stylesheet" href="../_tokens.css">
  <style>
    /* Same enterprise shell as calm; the focal target is the
       cds--inline-notification--warning, full content width. */
    html, body { width: 390px; height: 844px; overflow: hidden; }
    body { background: var(--cds-layer-01); }
    .scene { position: relative; width: 100%; height: 100%; }

    .cds--header { height: 48px; display: flex; align-items: stretch; }
    .cds--header__name { flex: 1 1 auto; border-right: 0; }
    .cds--header__title { font-size: 13px; }
    .cds--header__action { width: 48px; border-left: 1px solid #525252; }

    .content {
      padding: var(--cds-spacing-05);
      display: flex; flex-direction: column;
      gap: var(--cds-spacing-04);
    }
    .crumb { font-size: 12px; letter-spacing: 0.04em; color: var(--cds-text-secondary); text-transform: uppercase; }
    h1.page {
      margin: 0;
      font-size: var(--cds-heading-04-size);
      line-height: var(--cds-heading-04-line);
      font-weight: 400;
      color: var(--cds-text-primary);
    }

    /* Focal target — inline notification warning, stacked layout */
    #focal-target {
      flex-direction: column;
      align-items: stretch;
      background: var(--cds-notification-bg-warning);
    }
    #focal-target .cds--inline-notification__row {
      display: flex; align-items: stretch;
    }
    #focal-target .cds--inline-notification__icon {
      font-size: 20px;
      padding: var(--cds-spacing-04) var(--cds-spacing-04) 0 var(--cds-spacing-05);
    }
    #focal-target .cds--inline-notification__details {
      padding-top: var(--cds-spacing-04);
      padding-bottom: var(--cds-spacing-04);
    }
    #focal-target .cds--inline-notification__title {
      font-size: 16px; line-height: 22px;
    }
    #focal-target .metric {
      display: flex; align-items: baseline; gap: 6px;
      font-family: var(--cds-font-mono);
      margin-top: var(--cds-spacing-02);
    }
    #focal-target .metric .v {
      font-size: 48px; line-height: 1; font-weight: 600;
      color: var(--cds-text-primary); letter-spacing: -0.02em;
    }
    #focal-target .metric .u { font-size: 16px; color: var(--cds-text-secondary); }
    #focal-target .zone {
      font-family: var(--cds-font-mono);
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: #684E00;
      margin-top: var(--cds-spacing-02);
    }
    #focal-target .bar {
      margin: var(--cds-spacing-03) var(--cds-spacing-05) var(--cds-spacing-04);
      height: 4px; background: rgba(0,0,0,0.10);
    }
    #focal-target .bar > div { height: 100%; width: 84%; background: var(--cds-support-warning); }

    .grid {
      display: grid; grid-template-columns: 1fr 1fr;
      background: var(--cds-border-subtle-01);
      gap: 1px;
      border: 1px solid var(--cds-border-subtle-01);
    }
    .grid > .cds--tile { background: var(--cds-layer-02); padding: var(--cds-spacing-04) var(--cds-spacing-05); }
    .grid .cds--tile__value { font-size: 20px; }

    .status-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .status-row .cds--tag { font-family: var(--cds-font-mono); letter-spacing: 0.04em; }

    .footnote {
      position: absolute; left: var(--cds-spacing-05); right: var(--cds-spacing-05);
      bottom: var(--cds-spacing-05);
      padding-top: var(--cds-spacing-03);
      border-top: 1px solid var(--cds-border-subtle-01);
      font-size: 11px; color: var(--cds-text-helper);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="scene">

    <header class="cds--header">
      <div class="cds--header__name">
        <span class="cds--header__prefix">IBM</span>
        <span class="cds--header__title">Climbing · Pitch 03</span>
      </div>
      <div class="cds--header__action">≡</div>
    </header>

    <div class="content">
      <p class="crumb">Pitch 03 / Live</p>
      <h1 class="page">Action recommended</h1>

      <div id="focal-target"
           class="cds--inline-notification cds--inline-notification--warning"
           role="alert" data-focal="HR-zone amber flag">
        <div class="cds--inline-notification__row">
          <div class="cds--inline-notification__icon">⚠</div>
          <div class="cds--inline-notification__details">
            <p class="cds--inline-notification__title">Heart rate · Zone 4</p>
            <p class="cds--inline-notification__subtitle">
              Climbing toward Z5 redline. Pace down before next move.
            </p>
            <div class="metric">
              <span class="v">168</span>
              <span class="u">bpm</span>
            </div>
            <div class="zone">Threshold · Z4 / Z5</div>
          </div>
        </div>
        <div class="bar"><div></div></div>
      </div>

      <div class="grid">
        <div class="cds--tile">
          <p class="cds--tile__eyebrow">Route</p>
          <p class="cds--tile__value">14 / 22</p>
        </div>
        <div class="cds--tile">
          <p class="cds--tile__eyebrow">Pump</p>
          <p class="cds--tile__value">78<span class="cds--tile__unit">%</span></p>
        </div>
        <div class="cds--tile">
          <p class="cds--tile__eyebrow">Grip</p>
          <p class="cds--tile__value">00:34</p>
        </div>
        <div class="cds--tile">
          <p class="cds--tile__eyebrow">On wall</p>
          <p class="cds--tile__value">12:47</p>
        </div>
      </div>

      <div class="status-row">
        <span class="cds--tag cds--tag--green"><span class="cds--tag__dot"></span>Belay on</span>
        <span class="cds--tag cds--tag--cool-gray">Bat 64%</span>
        <span class="cds--tag cds--tag--yellow"><span class="cds--tag__dot"></span>Cloud build</span>
      </div>
    </div>

    <p class="footnote">Climbing Telemetry · Action required</p>

  </div>
</body>
</html>
