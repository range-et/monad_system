<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Carbon · Device · Warning</title>
  <link rel="stylesheet" href="../_tokens.css">
  <style>
    /* `cds--inline-notification--error` scaled to dominate the device.
       Carbon doesn't shout colors; it leverages structure: 4px red bar,
       error icon, bold short title, supportive subtitle, primary danger
       button. Other data lives in a suppressed strip below. */
    html, body { width: 390px; height: 844px; overflow: hidden; }
    body { background: var(--cds-layer-01); }
    .scene { position: relative; width: 100%; height: 100%; }

    .cds--header { height: 48px; display: flex; align-items: stretch; }
    .cds--header__name { flex: 1 1 auto; border-right: 0; }
    .cds--header__title { font-size: 13px; }
    .cds--header__action {
      width: 48px; border-left: 1px solid #525252;
      background: var(--cds-support-error);
      color: var(--cds-text-on-color);
    }

    .content {
      padding: var(--cds-spacing-05);
      display: flex; flex-direction: column;
      gap: var(--cds-spacing-04);
    }
    .crumb {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--cds-support-error);
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Focal target — error inline notification, scaled */
    #focal-target {
      flex-direction: column;
      align-items: stretch;
      background: #FFFFFF;
      border-left-width: 8px;
    }
    #focal-target .cds--inline-notification__icon {
      font-size: 32px;
      padding: var(--cds-spacing-05) var(--cds-spacing-04) 0 var(--cds-spacing-05);
      color: var(--cds-support-error);
    }
    #focal-target .cds--inline-notification__details {
      padding: var(--cds-spacing-05) var(--cds-spacing-05) var(--cds-spacing-05) 0;
      gap: var(--cds-spacing-03);
    }
    #focal-target .eyebrow {
      font-family: var(--cds-font-mono);
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--cds-support-error); margin: 0;
    }
    #focal-target .cds--inline-notification__title {
      font-size: 32px; line-height: 1.05;
      font-weight: 600; letter-spacing: -0.01em;
      color: var(--cds-text-primary);
      text-transform: uppercase;
    }
    #focal-target .cds--inline-notification__subtitle {
      font-size: 13px; line-height: 18px;
      color: var(--cds-text-secondary);
    }
    #focal-target .cds--btn {
      width: 100%; height: 48px;
      margin: var(--cds-spacing-03) var(--cds-spacing-05) var(--cds-spacing-05) 0;
    }

    .quiet-strip {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--cds-border-strong-01);
      border: 1px solid var(--cds-border-strong-01);
    }
    .quiet-strip > div {
      background: var(--cds-layer-02);
      padding: var(--cds-spacing-03) var(--cds-spacing-04);
    }
    .quiet-strip .k {
      font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--cds-text-helper);
    }
    .quiet-strip .v {
      font-family: var(--cds-font-mono);
      font-size: 13px; color: var(--cds-text-secondary);
      margin-top: 2px;
    }

    .footnote {
      position: absolute; left: var(--cds-spacing-05); right: var(--cds-spacing-05);
      bottom: var(--cds-spacing-05);
      padding-top: var(--cds-spacing-03);
      border-top: 1px solid var(--cds-border-subtle-01);
      font-size: 11px; color: var(--cds-text-helper);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="scene">

    <header class="cds--header">
      <div class="cds--header__name">
        <span class="cds--header__prefix">IBM</span>
        <span class="cds--header__title">Critical</span>
      </div>
      <div class="cds--header__action">●</div>
    </header>

    <div class="content">
      <p class="crumb">Master alarm · T+ 00:03</p>

      <div id="focal-target"
           class="cds--inline-notification cds--inline-notification--error"
           role="alert" data-focal="warning callout headline">
        <div style="display:flex;align-items:stretch;">
          <div class="cds--inline-notification__icon">▲</div>
          <div class="cds--inline-notification__details">
            <p class="eyebrow">Master alarm</p>
            <p class="cds--inline-notification__title">Fall risk detected</p>
            <p class="cds--inline-notification__subtitle">
              Anchor load spike 3 s ago. Last secure hold: move 14.
            </p>
          </div>
        </div>
        <button class="cds--btn cds--btn--danger">Stabilize — confirm anchor</button>
      </div>

      <div class="quiet-strip">
        <div><div class="k">HR</div><div class="v">192 bpm</div></div>
        <div><div class="k">Move</div><div class="v">17 / 22</div></div>
        <div><div class="k">Partner</div><div class="v">Notified</div></div>
      </div>
    </div>

    <p class="footnote">Climbing Telemetry · Master alarm active</p>

  </div>
</body>
</html>
