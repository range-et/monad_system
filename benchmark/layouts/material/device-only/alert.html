<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Material 3 · Device · Alert</title>
  <link rel="stylesheet" href="../_tokens.css">
  <style>
    /* M3 mobile alert: secondary-container tonal "banner" with a leading
       tertiary-tinted icon for amber semantics. The HR-zone callout takes
       the prime hero slot near the top of the scroll. */
    html { background: #000; }
    body {
      width: 390px; height: 844px; margin: 0 auto;
      background: var(--md-sys-color-background);
      display: flex; flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .statusbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px var(--md-sys-spacing-4) 0;
      font-size: var(--md-sys-typescale-label-medium-size);
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }

    .md-top-app-bar {
      padding: 0 var(--md-sys-spacing-3);
      height: 56px;
    }
    .md-top-app-bar__menu {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      color: var(--md-sys-color-on-surface);
    }
    .md-top-app-bar__title {
      font-size: var(--md-sys-typescale-title-large-size);
      flex: 1;
    }

    /* Focal target — tonal banner card for the HR-zone caution */
    #focal-target {
      margin: var(--md-sys-spacing-3) var(--md-sys-spacing-4);
      padding: var(--md-sys-spacing-5);
      background: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border-radius: var(--md-sys-shape-corner-extra-large);
      box-shadow: var(--md-sys-elevation-level1);
      display: flex; flex-direction: column; gap: var(--md-sys-spacing-3);
    }
    #focal-target .head {
      display: flex; align-items: center; gap: var(--md-sys-spacing-3);
    }
    #focal-target .icon {
      width: 40px; height: 40px;
      border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700;
      flex: 0 0 auto;
    }
    #focal-target .title {
      font-size: var(--md-sys-typescale-title-medium-size);
      font-weight: 500;
      color: var(--md-sys-color-on-secondary-container);
    }
    #focal-target .zone-tag {
      display: inline-flex; align-items: center;
      align-self: flex-start;
      height: 24px; padding: 0 var(--md-sys-spacing-3);
      border-radius: var(--md-sys-shape-corner-full);
      background: var(--md-sys-color-tertiary-container);
      color: var(--md-sys-color-on-tertiary-container);
      font-size: var(--md-sys-typescale-label-medium-size);
      font-weight: 500;
    }
    #focal-target .metric {
      display: flex; align-items: baseline; gap: var(--md-sys-spacing-2);
    }
    #focal-target .value {
      font-size: 64px; line-height: 1; font-weight: 400;
      letter-spacing: -1px;
      color: var(--md-sys-color-on-secondary-container);
    }
    #focal-target .unit {
      font-size: var(--md-sys-typescale-title-medium-size);
      color: var(--md-sys-color-on-secondary-container);
      opacity: 0.7;
    }
    #focal-target .sub {
      font-size: var(--md-sys-typescale-body-medium-size);
      color: var(--md-sys-color-on-secondary-container);
      opacity: 0.85;
    }
    #focal-target .progress {
      height: 8px;
      background: color-mix(in srgb, var(--md-sys-color-on-secondary-container) 14%, transparent);
      border-radius: var(--md-sys-shape-corner-full); overflow: hidden;
    }
    #focal-target .progress > div {
      height: 100%; width: 86%;
      background: var(--md-sys-color-tertiary);
      border-radius: inherit;
    }

    .section-title {
      margin: var(--md-sys-spacing-3) var(--md-sys-spacing-4) var(--md-sys-spacing-2);
      font-size: var(--md-sys-typescale-title-medium-size);
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }

    .grid {
      margin: 0 var(--md-sys-spacing-4);
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--md-sys-spacing-3);
    }
    .cell {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-corner-large);
      padding: var(--md-sys-spacing-3) var(--md-sys-spacing-4);
    }
    .cell__label {
      font-size: var(--md-sys-typescale-label-medium-size);
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }
    .cell__value {
      margin-top: 4px;
      font-size: var(--md-sys-typescale-title-large-size);
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }
    .cell__value small {
      font-size: var(--md-sys-typescale-body-small-size);
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 400; margin-left: 4px;
    }

    .progress-card {
      margin: var(--md-sys-spacing-3) var(--md-sys-spacing-4);
      padding: var(--md-sys-spacing-3) var(--md-sys-spacing-4);
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-corner-large);
    }
    .progress-card .row {
      display: flex; justify-content: space-between;
      font-size: var(--md-sys-typescale-label-medium-size);
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 6px;
    }
    .progress-card .bar {
      height: 6px; background: var(--md-sys-color-surface-container-highest);
      border-radius: var(--md-sys-shape-corner-full); overflow: hidden;
    }
    .progress-card .bar > div {
      height: 100%; width: 63.6%;
      background: var(--md-sys-color-primary);
      border-radius: inherit;
    }

    .md-nav-bar { margin-top: auto; }
  </style>
</head>
<body>
  <div class="statusbar">
    <span>13:14</span>
    <span>● ▲ 64%</span>
  </div>

  <div class="md-top-app-bar">
    <div class="md-top-app-bar__menu">≡</div>
    <div class="md-top-app-bar__title">El Cap · Pitch 6</div>
    <div class="md-top-app-bar__menu">⌕</div>
  </div>

  <div id="focal-target" data-focal="HR-zone amber flag">
    <div class="head">
      <div class="icon">▲</div>
      <div class="title">Heart-rate climbing</div>
    </div>
    <span class="zone-tag">Zone 4 · approaching redline</span>
    <div class="metric">
      <span class="value">168</span>
      <span class="unit">bpm</span>
    </div>
    <div class="sub">You're trending toward Zone 5. Rest 30 s before the next move.</div>
    <div class="progress"><div></div></div>
  </div>

  <div class="section-title">Climb data</div>
  <div class="grid">
    <div class="cell">
      <div class="cell__label">Grip time</div>
      <div class="cell__value">00:34</div>
    </div>
    <div class="cell">
      <div class="cell__label">On wall</div>
      <div class="cell__value">12:47</div>
    </div>
    <div class="cell">
      <div class="cell__label">Pump</div>
      <div class="cell__value">78<small>%</small></div>
    </div>
    <div class="cell">
      <div class="cell__label">Partner</div>
      <div class="cell__value">On belay</div>
    </div>
  </div>

  <div class="progress-card">
    <div class="row"><span>Route progress</span><span>14 / 22 moves</span></div>
    <div class="bar"><div></div></div>
  </div>

  <nav class="md-nav-bar">
    <div class="md-nav-bar__item md-nav-bar__item--active">
      <div class="md-nav-bar__icon">◉</div>
      <div>Climb</div>
    </div>
    <div class="md-nav-bar__item">
      <div class="md-nav-bar__icon">◐</div>
      <div>Route</div>
    </div>
    <div class="md-nav-bar__item">
      <div class="md-nav-bar__icon">◭</div>
      <div>Partner</div>
    </div>
    <div class="md-nav-bar__item">
      <div class="md-nav-bar__icon">◇</div>
      <div>Settings</div>
    </div>
  </nav>
</body>
</html>
