<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Material 3 · Device · Calm</title>
  <link rel="stylesheet" href="../_tokens.css">
  <style>
    /* Classic M3 mobile: top app bar, hero card with display-large metric,
       2x2 secondary card grid, bottom nav bar, plus an extended FAB. */
    html { background: #000; }
    body {
      width: 390px; height: 844px; margin: 0 auto;
      background: var(--md-sys-color-background);
      display: flex; flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .statusbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px var(--md-sys-spacing-4) 0;
      font-size: var(--md-sys-typescale-label-medium-size);
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }

    .md-top-app-bar {
      padding: 0 var(--md-sys-spacing-3);
      height: 56px;
      gap: var(--md-sys-spacing-2);
    }
    .md-top-app-bar__menu {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      color: var(--md-sys-color-on-surface);
    }
    .md-top-app-bar__title {
      font-size: var(--md-sys-typescale-title-large-size);
      font-weight: 400;
      flex: 1;
    }

    /* Hero card — focal target. Surface-container-low, extra-large radius. */
    #focal-target {
      margin: var(--md-sys-spacing-3) var(--md-sys-spacing-4);
      padding: var(--md-sys-spacing-5);
      background: var(--md-sys-color-surface-container-low);
      color: var(--md-sys-color-on-surface);
      border-radius: var(--md-sys-shape-corner-extra-large);
      box-shadow: var(--md-sys-elevation-level1);
      display: flex; flex-direction: column; gap: var(--md-sys-spacing-2);
    }
    #focal-target .eyebrow {
      font-size: var(--md-sys-typescale-label-large-size);
      font-weight: 500;
      color: var(--md-sys-color-primary);
    }
    #focal-target .metric {
      display: flex; align-items: baseline; gap: var(--md-sys-spacing-2);
    }
    #focal-target .value {
      font-size: 88px; line-height: 1; font-weight: 400;
      letter-spacing: -1.5px;
      color: var(--md-sys-color-on-surface);
    }
    #focal-target .unit {
      font-size: var(--md-sys-typescale-title-large-size);
      color: var(--md-sys-color-on-surface-variant);
    }
    #focal-target .sub {
      font-size: var(--md-sys-typescale-body-medium-size);
      color: var(--md-sys-color-on-surface-variant);
    }

    .section-title {
      margin: var(--md-sys-spacing-3) var(--md-sys-spacing-4) var(--md-sys-spacing-2);
      font-size: var(--md-sys-typescale-title-medium-size);
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }

    .grid {
      margin: 0 var(--md-sys-spacing-4);
      display: grid; grid-template-columns: 1fr 1fr;
      gap: var(--md-sys-spacing-3);
    }
    .cell {
      background: var(--md-sys-color-surface-container);
      border-radius: var(--md-sys-shape-corner-large);
      padding: var(--md-sys-spacing-4);
    }
    .cell__label {
      font-size: var(--md-sys-typescale-label-medium-size);
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }
    .cell__value {
      margin-top: 4px;
      font-size: var(--md-sys-typescale-headline-small-size);
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
    }
    .cell__value small {
      font-size: var(--md-sys-typescale-body-medium-size);
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 400; margin-left: 4px;
    }

    /* Extended FAB */
    .md-fab--extended {
      position: absolute; right: var(--md-sys-spacing-4); bottom: 104px;
      height: 56px;
    }

    /* Bottom nav */
    .md-nav-bar {
      margin-top: auto;
    }
  </style>
</head>
<body>
  <div class="statusbar">
    <span>09:42</span>
    <span>● ▲ 78%</span>
  </div>

  <div class="md-top-app-bar">
    <div class="md-top-app-bar__menu">≡</div>
    <div class="md-top-app-bar__title">Whistler Peak</div>
    <div class="md-top-app-bar__menu">⌕</div>
  </div>

  <div id="focal-target" data-focal="primary metric tile (current speed)">
    <span class="eyebrow">Current speed</span>
    <div class="metric">
      <span class="value">0</span>
      <span class="unit">km/h</span>
    </div>
    <span class="sub">Idle · last run 38 km/h · Zone 2 cruise</span>
  </div>

  <div class="section-title">Today's session</div>
  <div class="grid">
    <div class="cell">
      <div class="cell__label">Heart rate</div>
      <div class="cell__value">132<small>bpm</small></div>
    </div>
    <div class="cell">
      <div class="cell__label">Elevation</div>
      <div class="cell__value">2,140<small>m</small></div>
    </div>
    <div class="cell">
      <div class="cell__label">Distance</div>
      <div class="cell__value">14.2<small>km</small></div>
    </div>
    <div class="cell">
      <div class="cell__label">Elapsed</div>
      <div class="cell__value">01:23<small>:45</small></div>
    </div>
  </div>

  <button class="md-fab md-fab--extended">
    <span>▶</span>
    <span>Start run</span>
  </button>

  <nav class="md-nav-bar">
    <div class="md-nav-bar__item md-nav-bar__item--active">
      <div class="md-nav-bar__icon">◉</div>
      <div>Today</div>
    </div>
    <div class="md-nav-bar__item">
      <div class="md-nav-bar__icon">◐</div>
      <div>Map</div>
    </div>
    <div class="md-nav-bar__item">
      <div class="md-nav-bar__icon">◭</div>
      <div>History</div>
    </div>
    <div class="md-nav-bar__item">
      <div class="md-nav-bar__icon">◇</div>
      <div>Settings</div>
    </div>
  </nav>
</body>
</html>
