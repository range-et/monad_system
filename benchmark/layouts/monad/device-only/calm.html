<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monad · Device · Calm</title>
  <link rel="stylesheet" href="../../../../build/monad.css">
  <style>
    html { background: #000; }
    body {
      width: 390px; height: 844px; margin: 0 auto;
      background: var(--strata-bg);
      color: var(--strata-text-primary);
      font-family: var(--font-sans);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* Status row */
    .statusbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px var(--space-3) 0;
      font-family: var(--font-mono); font-size: var(--type-xs);
      color: var(--strata-text-secondary);
    }
    .statusbar .right { display: flex; gap: 10px; align-items: center; }
    .pip { width: 6px; height: 6px; background: var(--strata-success); display:inline-block; margin-right:6px; vertical-align:middle; }

    /* Header */
    .head {
      padding: var(--space-3) var(--space-3) var(--space-2);
      display: flex; flex-direction: column; gap: 4px;
      border-bottom: 1px solid var(--strata-border-subtle);
    }
    .head__eyebrow {
      font-family: var(--font-mono); font-size: var(--type-xs);
      color: var(--strata-text-disabled);
      letter-spacing: 0.16em; text-transform: uppercase;
    }
    .head__title {
      font-size: var(--type-2xl); font-weight: 300; letter-spacing: -0.02em;
      color: var(--strata-text-primary);
    }

    /* Primary focal — idle speed = 0, but tile is still the at-a-glance */
    #focal-target {
      margin: var(--space-3);
      padding: var(--space-4) var(--space-3);
      background: var(--strata-layer-01);
      border: 1px solid var(--strata-border);
      border-top: 3px solid var(--strata-interactive);
      display: flex; flex-direction: column; gap: 8px;
    }
    #focal-target .eyebrow {
      font-family: var(--font-mono); font-size: var(--type-xs);
      color: var(--strata-text-disabled);
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    #focal-target .value {
      font-family: var(--font-mono);
      font-size: 5.5rem; font-weight: 600; line-height: 1;
      color: var(--strata-text-primary); letter-spacing: -0.02em;
    }
    #focal-target .unit {
      font-family: var(--font-mono); font-size: var(--type-md);
      color: var(--strata-text-secondary); margin-left: 8px;
    }
    #focal-target .sub {
      font-family: var(--font-mono); font-size: var(--type-xs);
      color: var(--strata-text-secondary); margin-top: 4px;
    }

    /* Stat grid (4 secondary tiles) */
    .grid {
      margin: 0 var(--space-3);
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px; background: var(--strata-border-subtle);
      border: 1px solid var(--strata-border-subtle);
    }
    .grid .cell {
      background: var(--strata-layer-01);
      padding: var(--space-2) var(--space-3);
    }
    .grid .cell .k {
      font-family: var(--font-mono); font-size: var(--type-xs);
      color: var(--strata-text-disabled);
      letter-spacing: 0.14em; text-transform: uppercase;
    }
    .grid .cell .v {
      font-family: var(--font-mono); font-size: var(--type-xl);
      font-weight: 600; line-height: 1; margin-top: 8px;
      color: var(--strata-text-primary);
    }
    .grid .cell .v small {
      font-family: var(--font-mono); font-size: var(--type-sm);
      color: var(--strata-text-secondary); margin-left: 4px; font-weight: 400;
    }

    .footer {
      margin-top: auto;
      padding: var(--space-3);
      border-top: 1px solid var(--strata-border-subtle);
      display: flex; justify-content: space-between;
      font-family: var(--font-mono); font-size: var(--type-xs);
      color: var(--strata-text-disabled);
    }
  </style>
</head>
<body>
  <div class="statusbar">
    <span>09:42</span>
    <span class="right"><span><span class="pip"></span>GPS</span><span>BAT 78%</span></span>
  </div>

  <div class="head">
    <div class="head__eyebrow">SESSION · IDLE</div>
    <div class="head__title">Whistler Peak</div>
  </div>

  <div id="focal-target" data-focal="primary metric tile (current speed)">
    <div class="eyebrow">Speed</div>
    <div><span class="value">0</span><span class="unit">km/h</span></div>
    <div class="sub">Cruise · last run 38 km/h</div>
  </div>

  <div class="grid">
    <div class="cell">
      <div class="k">Heart</div>
      <div class="v">132<small>bpm</small></div>
    </div>
    <div class="cell">
      <div class="k">Elev</div>
      <div class="v">2,140<small>m</small></div>
    </div>
    <div class="cell">
      <div class="k">Distance</div>
      <div class="v">14.2<small>km</small></div>
    </div>
    <div class="cell">
      <div class="k">Elapsed</div>
      <div class="v">01:23<small>:45</small></div>
    </div>
  </div>

  <div class="footer">
    <span>STABLE · CLEAR</span>
    <span>SYNCED</span>
  </div>
</body>
</html>
