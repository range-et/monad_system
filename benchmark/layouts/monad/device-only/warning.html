<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monad · Device · Warning</title>
  <link rel="stylesheet" href="../../../../build/monad.css">
  <style>
    html { background: #000; }
    body {
      width: 390px; height: 844px; margin: 0 auto;
      /* NASA-1976 sensibility: the warning IS the red field. No body scrim
         needed — the focal-target itself is solid --strata-error edge-to-edge. */
      background: var(--strata-bg);
      color: var(--strata-text-primary);
      font-family: var(--font-sans);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .statusbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px var(--space-3) 0;
      font-family: var(--font-mono); font-size: var(--type-xs);
      color: var(--strata-text-secondary);
    }

    /* Warning callout — NASA-1976 sensibility: the warning IS the red field.
       Solid --strata-error (NASA Red) with --strata-on-error (off-white)
       type, flush-left, no decorative icon, inline white-field action
       button. Both tokens are system-level now — see colors.json + css_template.py. */
    #focal-target {
      margin: var(--space-4) var(--space-3) var(--space-3);
      background: var(--strata-error);
      color: var(--strata-on-error);
      border: 0;
    }
    #focal-target .bar {
      padding: var(--space-2) var(--space-3);
      display: flex; justify-content: space-between; align-items: center;
      font-family: var(--font-mono); font-weight: 600;
      letter-spacing: 0.18em; text-transform: uppercase;
      font-size: var(--type-xs);
      color: var(--strata-on-error);
      border-bottom: 1px solid color-mix(in srgb, var(--strata-on-error) 30%, transparent);
    }
    #focal-target .body {
      padding: var(--space-3) var(--space-3) var(--space-2);
      text-align: left;
    }
    #focal-target .headline {
      font-family: var(--font-mono);
      font-size: 2.5rem; font-weight: 700; line-height: 1.0;
      color: var(--strata-on-error);
      letter-spacing: -0.01em;
      text-transform: uppercase;
      margin: 0;
    }
    #focal-target .sub {
      margin-top: var(--space-2);
      font-family: var(--font-sans); font-size: var(--type-sm);
      color: var(--strata-on-error);
      opacity: 0.92;
      font-weight: 400;
    }
    #focal-target .action {
      margin: 0 var(--space-3) var(--space-3);
    }
    #focal-target .action span {
      display: block;
      padding: var(--space-2) var(--space-3);
      background: var(--strata-on-error);
      color: var(--strata-error);
      font-family: var(--font-mono); font-size: var(--type-sm);
      font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
      text-align: center;
    }
    #focal-target .meta {
      padding: var(--space-2) var(--space-3);
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 4px var(--space-2);
      font-family: var(--font-mono); font-size: var(--type-xs);
      color: var(--strata-on-error);
      opacity: 0.85;
      border-top: 1px solid color-mix(in srgb, var(--strata-on-error) 30%, transparent);
    }
    #focal-target .meta strong { color: var(--strata-on-error); font-weight: 700; opacity: 1; }

    .footer {
      margin-top: auto;
      padding: var(--space-3);
      display: flex; justify-content: center;
      font-family: var(--font-mono); font-size: var(--type-xs);
      color: var(--strata-text-disabled);
      letter-spacing: 0.16em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="statusbar">
    <span>13:18</span>
    <span>BAT 58%</span>
  </div>

  <div id="focal-target" data-focal="warning callout headline">
    <div class="bar">
      <span>◆ Master Alarm</span>
      <span>T+00:03</span>
    </div>
    <div class="body">
      <div class="headline">Fall Risk<br>Detected</div>
      <div class="sub">Anchor load spike with accelerometer event 3 s ago.</div>
    </div>
    <div class="action">
      <span>Stabilize → Confirm Anchor</span>
    </div>
    <div class="meta">
      <span>Last hold <strong>move 14</strong></span>
      <span>Partner <strong>NOTIFIED</strong></span>
      <span>HR <strong>192 bpm</strong></span>
      <span>Pump <strong>96%</strong></span>
    </div>
  </div>

  <div class="footer">Hold to acknowledge</div>
</body>
</html>
