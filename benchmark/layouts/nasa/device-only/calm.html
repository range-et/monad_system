<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NASA · Device · Calm</title>
  <link rel="stylesheet" href="../_tokens.css">
  <style>
    html, body { width: 390px; height: 844px; overflow: hidden; }
    body { background: var(--nasa-white); }
    .scene { position: relative; width: 100%; height: 100%; padding: 16px; }

    .nasa-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--nasa-black);
    }
    .nasa-bar__id { font-size: 14px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; }
    .nasa-bar__id .nasa-wordmark { font-size: 18px; margin-right: 12px; padding-right: 12px; border-right: 1px solid var(--nasa-black); }
    .nasa-bar__sys { display: flex; gap: 4px; }

    #focal-target {
      margin-top: 16px;
      padding: 24px;
      background: var(--nasa-white);
      border: 1px solid var(--nasa-black);
      border-top: 4px solid var(--nasa-red);
    }
    #focal-target .nasa-tile__eyebrow { color: var(--nasa-black); font-weight: 700; }
    #focal-target .nasa-tile__value { font-size: 84px; color: var(--nasa-red); }
    #focal-target .nasa-tile__unit  { font-size: 22px; color: var(--nasa-warm-gray); }

    .grid {
      margin-top: 16px;
      display: grid; grid-template-columns: 1fr 1fr;
      border: 1px solid var(--nasa-warm-gray);
    }
    .grid > .nasa-tile { padding: 12px 16px; }
    .grid > .nasa-tile:nth-child(even) { border-left: 1px solid var(--nasa-warm-gray); }
    .grid > .nasa-tile:nth-child(n+3)  { border-top: 1px solid var(--nasa-warm-gray); }
    .grid .nasa-tile__value { font-size: 22px; }

    .footnote {
      position: absolute; left: 16px; right: 16px; bottom: 16px;
      padding-top: 8px;
      border-top: 1px solid var(--nasa-warm-gray);
      font-family: var(--nasa-serif);
      font-size: 11px; color: var(--nasa-warm-gray);
    }
  </style>
</head>
<body>
  <div class="scene">

    <header class="nasa-bar">
      <div class="nasa-bar__id"><span class="nasa-wordmark">NASA</span>Run 05</div>
      <div class="nasa-bar__sys">
        <span class="nasa-chip">Bat 78%</span>
      </div>
    </header>

    <div id="focal-target" class="nasa-tile" data-focal="primary speed tile">
      <p class="nasa-tile__eyebrow">Speed · Primary</p>
      <p class="nasa-tile__value">38<span class="nasa-tile__unit">km/h</span></p>
    </div>

    <div class="grid">
      <div class="nasa-tile">
        <p class="nasa-tile__eyebrow">Elev</p>
        <p class="nasa-tile__value">2,140<span class="nasa-tile__unit">m</span></p>
      </div>
      <div class="nasa-tile">
        <p class="nasa-tile__eyebrow">HR</p>
        <p class="nasa-tile__value">132<span class="nasa-tile__unit">bpm</span></p>
      </div>
      <div class="nasa-tile">
        <p class="nasa-tile__eyebrow">Distance</p>
        <p class="nasa-tile__value">14.2<span class="nasa-tile__unit">km</span></p>
      </div>
      <div class="nasa-tile">
        <p class="nasa-tile__eyebrow">Elapsed</p>
        <p class="nasa-tile__value">01:23</p>
      </div>
    </div>

    <p class="footnote">Whistler Peak Telemetry · System nominal · GPS lock</p>

  </div>
</body>
</html>
